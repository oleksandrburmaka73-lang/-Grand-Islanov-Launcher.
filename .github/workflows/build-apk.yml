name: Build Grand Islanov APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -q Grand-Islanov-Launcher-Part3-Source.zip -d source
          test -f source/settings.gradle

      - name: Build APK
        working-directory: source
        run: gradle assembleDebug

      - name: Rename APK
        run: cp source/app/build/outputs/apk/debug/app-debug.apk Grand-Islanov.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grand-Islanov-APK
          path: Grand-Islanov.apk
